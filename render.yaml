services:
  - type: web
    name: jomish-casino
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SLOTSLAUNCH_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: DUSUPAY_API_KEY
        sync: false
      - key: DUSUPAY_MERCHANT_ID
        sync: false
      - key: DUSUPAY_ENVIRONMENT
        value: sandbox
